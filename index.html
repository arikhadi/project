<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ bot_name }} · {{ use_case }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-base: #f0f4f8;
    --bg-mesh: radial-gradient(at 0% 0%, rgba(13, 148, 136, 0.12) 0px, transparent 50%),
               radial-gradient(at 100% 0%, rgba(14, 165, 233, 0.12) 0px, transparent 50%),
               radial-gradient(at 50% 100%, rgba(245, 158, 11, 0.08) 0px, transparent 50%);
    --surface: rgba(255, 255, 255, 0.85);
    --surface-glass: rgba(255, 255, 255, 0.65);
    --surface-card: #ffffff;
    --border: rgba(226, 232, 240, 0.8);
    --border-highlight: rgba(13, 148, 136, 0.3);
    
    --text-primary: #0f172a;
    --text-secondary: #475569;
    --text-muted: #94a3b8;
    
    --brand-500: #0d9488;
    --brand-600: #0f766e;
    --brand-gradient: linear-gradient(135deg, #0d9488 0%, #0284c7 100%);
    --brand-gradient-hover: linear-gradient(135deg, #0f766e 0%, #0369a1 100%);
    --accent: #f59e0b;
    
    --user-bubble: linear-gradient(135deg, #0d9488 0%, #0284c7 100%);
    --user-text: #ffffff;
    --bot-bubble: rgba(255, 255, 255, 0.95);
    --bot-text: #1e293b;
    
    --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
    --shadow-lg: 0 10px 25px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -4px rgba(0, 0, 0, 0.04);
    --shadow-glow: 0 8px 24px -4px rgba(13, 148, 136, 0.25);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg-base: #090d16;
      --bg-mesh: radial-gradient(at 0% 0%, rgba(13, 148, 136, 0.18) 0px, transparent 50%),
                 radial-gradient(at 100% 0%, rgba(2, 132, 199, 0.18) 0px, transparent 50%),
                 radial-gradient(at 50% 100%, rgba(245, 158, 11, 0.08) 0px, transparent 50%);
      --surface: rgba(15, 23, 42, 0.85);
      --surface-glass: rgba(15, 23, 42, 0.65);
      --surface-card: #0f172a;
      --border: rgba(51, 65, 85, 0.6);
      --border-highlight: rgba(45, 212, 191, 0.3);
      
      --text-primary: #f8fafc;
      --text-secondary: #cbd5e1;
      --text-muted: #64748b;
      
      --bot-bubble: #1e293b;
      --bot-text: #f1f5f9;
      --shadow-lg: 0 12px 30px -4px rgba(0, 0, 0, 0.4);
      --shadow-glow: 0 8px 24px -4px rgba(45, 212, 191, 0.2);
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    background: var(--bg-base);
    background-image: var(--bg-mesh);
    background-attachment: fixed;
    color: var(--text-primary);
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 16px;
    -webkit-font-smoothing: antialiased;
  }

  /* Main Container */
  .app-layout {
    width: 100%;
    max-width: 1140px;
    height: 94vh;
    display: grid;
    grid-template-columns: 1fr 310px;
    gap: 20px;
    animation: fadeIn 0.4s ease-out;
  }

  @media (max-width: 900px) {
    .app-layout {
      grid-template-columns: 1fr;
      height: 98vh;
      gap: 12px;
    }
    .side-panel { display: none; }
  }

  /* Chat Main Card */
  .chat-card {
    background: var(--surface);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    border-radius: 24px;
    box-shadow: var(--shadow-lg);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }

  /* Header */
  .chat-header {
    padding: 16px 24px;
    background: var(--surface-glass);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 14px;
    z-index: 10;
  }

  .bot-avatar-badge {
    width: 48px;
    height: 48px;
    border-radius: 16px;
    background: var(--brand-gradient);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: var(--shadow-glow);
    font-size: 24px;
    flex-shrink: 0;
    transition: transform 0.25s ease;
  }
  .bot-avatar-badge:hover { transform: scale(1.05) rotate(5deg); }

  .header-info h1 {
    font-size: 18px;
    font-weight: 700;
    color: var(--text-primary);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .online-indicator {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    font-weight: 600;
    color: #10b981;
    background: rgba(16, 185, 129, 0.1);
    padding: 2px 8px;
    border-radius: 20px;
  }
  .online-dot {
    width: 6px;
    height: 6px;
    background: #10b981;
    border-radius: 50%;
    box-shadow: 0 0 8px #10b981;
    animation: pulse 2s infinite;
  }
  .header-info p {
    font-size: 13px;
    color: var(--text-muted);
    margin-top: 2px;
  }

  .header-actions {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  /* Style Selector Segment */
  .style-switch {
    background: var(--border);
    padding: 3px;
    border-radius: 12px;
    display: flex;
    gap: 2px;
  }
  .style-btn {
    border: 0;
    background: transparent;
    color: var(--text-secondary);
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    padding: 6px 14px;
    border-radius: 9px;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .style-btn.on {
    background: var(--surface-card);
    color: var(--brand-500);
    box-shadow: var(--shadow-sm);
  }

  /* Chat Logs */
  .chat-log {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    scroll-behavior: smooth;
  }
  .chat-log::-webkit-scrollbar { width: 6px; }
  .chat-log::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 10px;
  }

  /* Message Bubbles */
  .message-wrapper {
    display: flex;
    flex-direction: column;
    max-width: 84%;
    animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .message-wrapper.bot { align-self: flex-start; }
  .message-wrapper.user { align-self: flex-end; }

  .msg {
    padding: 13px 18px;
    border-radius: 20px;
    font-size: 14.5px;
    line-height: 1.6;
    word-break: break-word;
    position: relative;
  }

  .msg.user {
    background: var(--user-bubble);
    color: var(--user-text);
    border-bottom-right-radius: 4px;
    box-shadow: var(--shadow-glow);
    font-weight: 500;
  }

  .msg.bot {
    background: var(--bot-bubble);
    color: var(--bot-text);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
    box-shadow: var(--shadow-sm);
  }

  .msg.bot strong {
    color: var(--brand-500);
    font-weight: 700;
  }

  .msg.bot ul, .msg.bot ol {
    margin: 8px 0 8px 20px;
    padding-left: 0;
  }
  .msg.bot li {
    margin-bottom: 4px;
  }

  .msg.err {
    background: #fef2f2;
    border: 1px solid #fecaca;
    color: #b91c1c;
    border-radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    .msg.err { background: #450a0a; border-color: #7f1d1d; color: #fca5a5; }
  }

  /* Enhanced Weather Card */
  .weather-card {
    background: linear-gradient(135deg, rgba(14, 165, 233, 0.12) 0%, rgba(13, 148, 136, 0.08) 100%);
    border: 1px solid var(--border-highlight);
    border-radius: 18px;
    padding: 16px 20px;
    margin-bottom: 4px;
    box-shadow: var(--shadow-sm);
    animation: slideUp 0.3s ease;
  }
  .wx-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .wx-loc {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 700;
    font-size: 15px;
    color: var(--brand-500);
  }
  .wx-badge {
    background: rgba(13, 148, 136, 0.15);
    color: var(--brand-500);
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
  }
  .wx-current {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 14px;
  }
  .wx-temp {
    font-size: 32px;
    font-weight: 800;
    letter-spacing: -1px;
    color: var(--text-primary);
  }
  .wx-cond {
    font-size: 14px;
    font-weight: 500;
    color: var(--text-secondary);
  }
  .wx-forecast-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    border-top: 1px solid var(--border);
    padding-top: 12px;
  }
  .wx-day-col {
    background: var(--surface-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 8px;
    text-align: center;
  }
  .wx-day-date {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    margin-bottom: 4px;
  }
  .wx-day-cond {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .wx-day-temp {
    font-size: 12px;
    font-weight: 700;
    color: var(--brand-500);
  }

  /* Recommendation Chips */
  .chips-container {
    padding: 6px 24px 14px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .suggestion-chip {
    border: 1px solid var(--border);
    background: var(--surface-card);
    color: var(--text-secondary);
    border-radius: 999px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 500;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow: var(--shadow-sm);
  }
  .suggestion-chip:hover {
    border-color: var(--brand-500);
    color: var(--brand-500);
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
  }

  /* Input Footer Area */
  .chat-input-area {
    padding: 16px 20px;
    background: var(--surface-glass);
    border-top: 1px solid var(--border);
    display: flex;
    gap: 12px;
    align-items: center;
  }
  .input-field-wrapper {
    flex: 1;
    position: relative;
    display: flex;
    align-items: center;
  }
  .chat-input {
    width: 100%;
    border: 1.5px solid var(--border);
    background: var(--surface-card);
    color: var(--text-primary);
    border-radius: 16px;
    padding: 13px 18px;
    font-family: inherit;
    font-size: 14px;
    outline: none;
    transition: all 0.2s ease;
    box-shadow: var(--shadow-sm);
  }
  .chat-input:focus {
    border-color: var(--brand-500);
    box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.15);
  }
  .chat-input::placeholder { color: var(--text-muted); }

  .btn-send {
    border: 0;
    background: var(--brand-gradient);
    color: #ffffff;
    border-radius: 16px;
    padding: 13px 22px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    box-shadow: var(--shadow-glow);
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .btn-send:hover:not(:disabled) {
    background: var(--brand-gradient-hover);
    transform: translateY(-1px);
    box-shadow: 0 10px 25px -4px rgba(13, 148, 136, 0.35);
  }
  .btn-send:disabled {
    opacity: 0.55;
    cursor: not-allowed;
    transform: none;
  }

  /* Sidebar */
  .side-panel {
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .panel-card {
    background: var(--surface);
    backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 18px 20px;
    box-shadow: var(--shadow-md);
  }

  .panel-title {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--brand-500);
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 14px;
  }

  /* Traveler Passport / Memory */
  .passport-box {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .passport-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 7px 10px;
    border-radius: 10px;
    background: var(--surface-card);
    border: 1px solid var(--border);
  }
  .passport-label {
    font-size: 12px;
    color: var(--text-muted);
    font-weight: 600;
  }
  .passport-val {
    font-size: 13px;
    font-weight: 700;
    color: var(--brand-500);
  }
  .passport-empty {
    font-size: 13px;
    line-height: 1.5;
    color: var(--text-muted);
    padding: 6px 0;
  }

  /* Status engine */
  .engine-badge {
    background: var(--surface-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
    font-size: 12.5px;
    color: var(--text-secondary);
    line-height: 1.6;
    margin-bottom: 12px;
  }
  .engine-row {
    display: flex;
    justify-content: space-between;
    margin-bottom: 4px;
  }
  .engine-row:last-child { margin-bottom: 0; }
  .engine-label { color: var(--text-muted); }
  .engine-val { font-weight: 600; color: var(--text-primary); }

  .btn-reset {
    width: 100%;
    border: 1px dashed var(--border);
    background: transparent;
    color: var(--text-muted);
    padding: 9px;
    border-radius: 12px;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .btn-reset:hover {
    border-color: #ef4444;
    color: #ef4444;
    background: rgba(239, 68, 68, 0.05);
  }

  /* Loading Dots */
  .dots-indicator {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 12px 18px;
  }
  .dots-indicator span {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--brand-500);
    animation: bounce 1.2s infinite ease-in-out both;
  }
  .dots-indicator span:nth-child(1) { animation-delay: -0.32s; }
  .dots-indicator span:nth-child(2) { animation-delay: -0.16s; }

  @keyframes bounce {
    0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
    40% { transform: scale(1.1); opacity: 1; }
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes pulse {
    0% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(1.2); }
    100% { opacity: 1; transform: scale(1); }
  }
</style>
</head>
<body>

<div class="app-layout">
  <!-- Main Chat Card -->
  <section class="chat-card">
    <header class="chat-header">
      <div class="bot-avatar-badge">🧭</div>
      <div class="header-info">
        <h1>
          {{ bot_name }}
          <span class="online-indicator">
            <span class="online-dot"></span>
            Aktif
          </span>
        </h1>
        <p>{{ use_case }} domestik Indonesia berbasis AI</p>
      </div>

      <div class="header-actions">
        <div class="style-switch" id="styleSeg" title="Pilih gaya respon AI">
          <button class="style-btn" data-s="santai">😊 Santai</button>
          <button class="style-btn" data-s="formal">👔 Formal</button>
        </div>
      </div>
    </header>

    <!-- Chat Messages Log -->
    <div class="chat-log" id="log"></div>

    <!-- Suggested Question Chips -->
    <div class="chips-container" id="chips"></div>

    <!-- User Input Footer -->
    <form class="chat-input-area" id="f" autocomplete="off">
      <div class="input-field-wrapper">
        <input 
          type="text" 
          id="q" 
          class="chat-input" 
          placeholder="Tanya rekomendasi wisata, itinerary, perkiraan budget, atau cuaca..." 
          maxlength="500" 
          autofocus
        >
      </div>
      <button class="btn-send" id="send" type="submit">
        <span>Kirim</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </form>
  </section>

  <!-- Sidebar Panel -->
  <aside class="side-panel">
    <!-- Traveler Passport / Memory -->
    <div class="panel-card">
      <div class="panel-title">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
        Profil Pelancong
      </div>
      <div id="mem" class="passport-box">
        <p class="passport-empty">Belum ada info memori.<br>Coba katakan:<br><em>“Namaku Rani dari Bandung, budget 3 juta, suka wisata pantai.”</em></p>
      </div>
    </div>

    <!-- Engine & Features Status -->
    <div class="panel-card">
      <div class="panel-title">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
        Status Sistem
      </div>
      <div id="status" class="engine-badge">
        <div class="engine-row"><span class="engine-label">Memuat status AI...</span></div>
      </div>
      <button class="btn-reset" id="reset" type="button" title="Bersihkan obrolan dan data memori">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
        </svg>
        Reset Percakapan &amp; Memori
      </button>
    </div>
  </aside>
</div>

<script>
const $ = s => document.querySelector(s);
const log = $('#log'), chips = $('#chips'), q = $('#q'), sendBtn = $('#send');
let style = localStorage.getItem('style') || 'santai';
let sid = localStorage.getItem('sid') || (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()));
localStorage.setItem('sid', sid);

function setStyle(s){
  style = s;
  localStorage.setItem('style', s);
  document.querySelectorAll('#styleSeg button').forEach(b => b.classList.toggle('on', b.dataset.s === s));
}
document.querySelectorAll('#styleSeg button').forEach(b => b.onclick = () => setStyle(b.dataset.s));
setStyle(style);

/* Simple, safe markdown to formatted HTML */
function formatMarkdown(text){
  const escapeHTML = str => str.replace(/[&<>'"]/g, tag => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
  }[tag] || tag));

  let lines = text.split('\n');
  let inList = false;
  let out = [];

  for(let raw of lines){
    let line = escapeHTML(raw);

    // Bold text **word**
    line = line.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
    // Italic text *word*
    line = line.replace(/(^|[^*])\*(?!\*)(.*?)\*/g, '$1<em>$2</em>');

    // Bullet points
    if(/^\s*[-•*]\s+(.*)/.test(raw)){
      let content = raw.replace(/^\s*[-•*]\s+/, '');
      content = escapeHTML(content).replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
      if(!inList){ out.push('<ul>'); inList = true; }
      out.push(`<li>${content}</li>`);
    } else {
      if(inList){ out.push('</ul>'); inList = false; }
      if(line.trim()){
        out.push(`<p>${line}</p>`);
      } else {
        out.push('<br>');
      }
    }
  }
  if(inList) out.push('</ul>');
  return out.join('');
}

function add(text, cls){
  const wrapper = document.createElement('div');
  wrapper.className = 'message-wrapper ' + cls;
  
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  
  if(cls === 'user' || cls === 'err'){
    d.textContent = text;
  } else {
    d.innerHTML = formatMarkdown(text);
  }
  
  wrapper.appendChild(d);
  log.appendChild(wrapper);
  log.scrollTop = log.scrollHeight;
  return wrapper;
}

function addWeather(w){
  const card = document.createElement('div');
  card.className = 'weather-card';
  
  const s = w.sekarang;
  
  let forecastHTML = '';
  if(w.prakiraan && w.prakiraan.length){
    forecastHTML = `
      <div class="wx-forecast-grid">
        ${w.prakiraan.map(p => `
          <div class="wx-day-col">
            <div class="wx-day-date">${p.tanggal}</div>
            <div class="wx-day-cond" title="${p.kondisi}">${p.kondisi}</div>
            <div class="wx-day-temp">${p.min}°–${p.max}°C</div>
          </div>
        `).join('')}
      </div>
    `;
  }

  card.innerHTML = `
    <div class="wx-header">
      <div class="wx-loc">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
          <circle cx="12" cy="10" r="3"></circle>
        </svg>
        ${w.lokasi}
      </div>
      <span class="wx-badge">Prakiraan Real-Time</span>
    </div>
    <div class="wx-current">
      <div class="wx-temp">${s.suhu}°C</div>
      <div class="wx-cond">${s.kondisi}</div>
    </div>
    ${forecastHTML}
  `;
  
  log.appendChild(card);
  log.scrollTop = log.scrollHeight;
}

function renderMem(p){
  const m = $('#mem');
  m.innerHTML = '';
  const keys = Object.keys(p || {});
  if(!keys.length){
    m.innerHTML = '<p class="passport-empty">Belum ada info memori.<br>Coba katakan:<br><em>“Namaku Rani dari Bandung, budget 3 juta, suka wisata pantai.”</em></p>';
    return;
  }
  
  const iconMap = {
    'nama': '👤 Nama',
    'asal': '📍 Kota Asal',
    'budget': '💰 Budget',
    'minat': '🏖️ Minat'
  };

  keys.forEach(k => {
    const row = document.createElement('div');
    row.className = 'passport-row';
    const label = iconMap[k] || k.toUpperCase();
    row.innerHTML = `
      <span class="passport-label">${label}</span>
      <span class="passport-val">${p[k]}</span>
    `;
    m.appendChild(row);
  });
}

function setChips(list){
  chips.innerHTML = '';
  (list || []).forEach(t => {
    const b = document.createElement('button');
    b.className = 'suggestion-chip';
    b.type = 'button';
    b.innerHTML = `
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
      </svg>
      <span>${t}</span>
    `;
    b.onclick = () => send(t);
    chips.appendChild(b);
  });
}

async function send(text){
  text = (text || '').trim();
  if(!text) return;
  add(text, 'user');
  q.value = '';
  setChips([]);
  sendBtn.disabled = true;

  const typingWrap = document.createElement('div');
  typingWrap.className = 'message-wrapper bot';
  const typing = document.createElement('div');
  typing.className = 'msg bot dots-indicator';
  typing.innerHTML = '<span></span><span></span><span></span>';
  typingWrap.appendChild(typing);
  log.appendChild(typingWrap);
  log.scrollTop = log.scrollHeight;

  try {
    const r = await fetch('/api/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({session_id: sid, message: text, style})
    });
    const j = await r.json();
    typingWrap.remove();

    if(!r.ok){
      add(j.error || 'Terjadi kendala saat memproses permintaan.', 'err');
    } else {
      if(j.weather) addWeather(j.weather);
      add(j.reply, 'bot');
      setChips(j.suggestions);
      renderMem(j.profile);
    }
  } catch(e) {
    typingWrap.remove();
    add('Gagal terhubung ke server. Pastikan Flask sedang berjalan.', 'err');
  }

  sendBtn.disabled = false;
  q.focus();
}

$('#f').onsubmit = e => {
  e.preventDefault();
  send(q.value);
};

$('#reset').onclick = async () => {
  if(!confirm('Hapus seluruh riwayat percakapan dan memori?')) return;
  await fetch('/api/reset', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({session_id: sid})
  });
  log.innerHTML = '';
  renderMem({});
  greet();
};

async function greet(){
  try {
    const c = await (await fetch('/api/config')).json();
    const f = c.features;
    
    $('#status').innerHTML = `
      <div class="engine-row">
        <span class="engine-label">AI Engine</span>
        <span class="engine-val" style="color:var(--brand-500)">${c.provider.toUpperCase()} (${c.model})</span>
      </div>
      <div class="engine-row">
        <span class="engine-label">API Cuaca</span>
        <span class="engine-val">${f.weather_api ? '✓ Open-Meteo' : 'Off'}</span>
      </div>
      <div class="engine-row">
        <span class="engine-label">Fitur Memori</span>
        <span class="engine-val">${f.memory ? '✓ Aktif' : 'Off'}</span>
      </div>
    `;

    add('Halo! Aku **Jalan-Jalan Buddy** 🧭\n\nMau liburan ke mana kali ini? Aku bisa membantumu merencanakan **itinerary harian**, menghitung **estimasi budget**, mencari **kuliner autentik**, hingga mengecek **prakiraan cuaca real-time** destinasi tujuanmu.', 'bot');
    setChips(['Buatkan itinerary 3 hari di Yogyakarta', 'Cuaca di Bali minggu ini', 'Rekomendasi pantai budget 2 juta']);
  } catch(e) {
    console.error('Gagal memuat config:', e);
  }
}

(async () => {
  try {
    const mem = await (await fetch('/api/memory?session_id=' + sid)).json();
    renderMem(mem);
  } catch(e) {}
  greet();
})();
</script>
